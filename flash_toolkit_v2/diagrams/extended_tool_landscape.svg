<text class="text" x="55" y="385">RABCDAsm (assembler/disassembler)</text>
<text class="text" x="55" y="407">abcd (MITRE) – minimal ABC disassembler</text>
<text class="text" x="55" y="429">as3commons-bytecode (Java)</text>
