<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #f8f8f8; stroke: #333; stroke-width: 2; rx: 14; ry: 14; }
      .title { font: 700 22px sans-serif; fill: #111; }
      .text { font: 15px sans-serif; fill: #111; }
      .small { font: 12px sans-serif; fill: #555; }
      .line { stroke: #333; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
<text class="title" x="20" y="40">Extended Flash/AMF/LSO Tool Landscape</text>
<rect class="box" x="40" y="80" width="400" height="200"/>
<text class="title" x="55" y="110">AMF & LSO Codecs (Multi‑Lang)</text>
