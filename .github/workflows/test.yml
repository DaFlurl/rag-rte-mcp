name: Evony RTE Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-timeout
        pip install pyamf scapy requests
        pip install -r requirements.txt
      continue-on-error: true
    
    - name: Run handler tests
      run: |
        python -m pytest evony_rte/tests/ -v --timeout=60 --tb=short
      env:
        PYTHONPATH: .
    
    - name: Run comprehensive test
      run: |
        python evony_rte/test_comprehensive.py
      env:
        PYTHONPATH: .
    
    - name: Check handler count
      run: |
        python -c "from evony_rte.mcp_server import HANDLERS; assert len(HANDLERS) >= 55, f'Only {len(HANDLERS)} handlers'"

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linters
      run: |
        pip install flake8 black isort
    
    - name: Check formatting
      run: |
        black --check --diff evony_rte/ || true
        isort --check-only evony_rte/ || true
    
    - name: Lint with flake8
      run: |
        flake8 evony_rte/ --max-line-length=120 --ignore=E501,W503 --count --show-source --statistics || true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Security scan
      run: |
        pip install bandit safety
        bandit -r evony_rte/ -ll || true
        safety check || true
