# LLaMA-Factory Fine-Tuning Configuration
# Evony Knowledge Model
# https://github.com/hiyouga/LLaMA-Factory

### Model Configuration ###
# RECOMMENDED: Qwen2.5-14B Abliterated (uncensored, 128K context)
model_name_or_path: huihui-ai/Qwen2.5-14B-Instruct-abliterated
# Alternatives (all abliterated/uncensored):
# model_name_or_path: huihui-ai/Qwen2.5-7B-Instruct-abliterated
# model_name_or_path: mlabonne/Meta-Llama-3.1-8B-Instruct-abliterated

### Method ###
stage: sft
do_train: true
finetuning_type: lora

### Dataset ###
dataset: evony_knowledge
dataset_dir: ./Evony_Training_Data
template: alpaca
cutoff_len: 2048
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 16

### Output ###
output_dir: ./evony_llama_factory_output
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### Training Hyperparameters ###
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### Evaluation ###
val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 500

### LoRA Configuration ###
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all

### Quantization (QLoRA) ###
quantization_bit: 4
quantization_method: bitsandbytes

### Additional Options ###
flash_attn: auto
use_unsloth: false
enable_liger_kernel: false
